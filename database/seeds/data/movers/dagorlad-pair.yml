mover:
  slug: dagorlad-pair
  name: Brog and Liss
  kind: company
  canon: false
  motivation: >-
    Two of four bandits who hid in the marsh of the dead and robbed the
    jewels from ancient corpses — and the jewels keep them alive. Two who
    tried to walk out with the loot were chased down by the spectres; these
    two learned. Near a hundred years together now, looking barely fifty,
    hating each other with the patience of the undying — the big one cannot
    fish, the small one cannot fight.
  description: >-
    Brog does not fish and Liss does not fight — two wretched immortals
    arguing in a speech that is almost Westron and mostly splashing,
    condemned to each other in a swamp that does not forget.

legs:
  - kind: presence
    from: '3017-01-01'
    to: '3018-12-31'
    region: Dagorlad
    level: 3
    road_bias: { off_road: 1 }
    visibility: hidden
    hostile: false
    active_phases: [before_sleep, mid_night]
    trace: 'Two voices quarrel in the mists — almost Westron, mostly splashing — and a fire too small for honest travellers smokes among the pools.'
    beat:
      title: The two who cannot leave
      text: >-
        They squat by a black pool over a meal of raw fish eaten with their
        fingers, and they do not stop bickering even as they size you up.
        Brog is enormous — bald, stone-strong, white beard to the waist —
        and Liss is a small thin man with a glass eye that does not move.
        They speak a slurred, deformed Westron you can only half-follow:
        they are deciding whether your gear is worth the trouble, and the
        trouble is that nothing is allowed to leave the marsh. Not corpses'
        jewels, not them — and maybe, they are working out, not you.
      effects: { shadow: 2 }
